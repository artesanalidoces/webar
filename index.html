<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Artesanali AR</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

html,
body{
margin:0;
padding:0;
overflow:hidden;
width:100%;
height:100%;
font-family:Arial;
background:#000;
}

#loading{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
background:#000;
color:#fff;
font-size:24px;
z-index:999;
}

</style>

</head>

<body>

<div id="loading">
Carregando...
</div>

<a-scene

mindar-image="

imageTargetSrc: targets.mind;

uiScanning: yes;

uiLoading: no;

uiError: yes;

"

embedded

color-space="sRGB"

renderer="colorManagement:true, physicallyCorrectLights:true"

vr-mode-ui="enabled: false"

device-orientation-permission-ui="enabled: false"

>

<a-assets>

<a-asset-item
id="modelo"
src="Untitled.glb">
</a-asset-item>

</a-assets>

<a-camera
position="0 0 0"
look-controls="enabled:false">
</a-camera>

<a-entity mindar-image-target="targetIndex:0">

<a-gltf-model

src="#modelo"

position="0 0 0"

rotation="0 0 0"

scale="0.30 0.30 0.30"

animation-mixer

>

</a-gltf-model>

</a-entity>

</a-scene>

<script>

window.addEventListener("load",()=>{

setTimeout(()=>{

document.getElementById("loading").style.display="none";

},2000);

});

</script>

</body>
</html>
