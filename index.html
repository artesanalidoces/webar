<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Artesanali 3D</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#f4f4f4;
      font-family:Arial,Helvetica,sans-serif;
      display:flex;
      flex-direction:column;
      height:100vh;
    }

    header{
      background:#7b3f00;
      color:white;
      text-align:center;
      padding:15px;
      font-size:22px;
      font-weight:bold;
    }

    model-viewer{
      width:100%;
      flex:1;
      background:#ffffff;
    }

    footer{
      text-align:center;
      padding:15px;
      background:#ffffff;
      border-top:1px solid #ddd;
    }

    button{
      background:#e53935;
      color:white;
      border:none;
      padding:15px 25px;
      border-radius:8px;
      font-size:18px;
      cursor:pointer;
    }
  </style>

</head>

<body>

<header>
Artesanali Doces
</header>

<model-viewer

id="viewer"

src="Untitled.glb"

camera-controls

touch-action="pan-y"

auto-rotate

shadow-intensity="1"

exposure="1"

loading="eager"

reveal="auto"

poster=""

>

</model-viewer>

<footer>

<button id="btnAR">

Ver em Realidade Aumentada

</button>

</footer>

<script>

const viewer=document.getElementById("viewer");
const btn=document.getElementById("btnAR");

if(viewer.canActivateAR){

}else{

btn.style.display="none";

}

btn.onclick=()=>{

viewer.activateAR();

};

</script>

</body>
</html>
