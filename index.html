<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Artesanali AR</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

html,body{
    margin:0;
    overflow:hidden;
    font-family:Arial;
}

#loading{

position:fixed;

top:0;
left:0;
right:0;
bottom:0;

background:#ffffff;

display:flex;

justify-content:center;

align-items:center;

font-size:24px;

z-index:9999;

}

</style>

</head>

<body>

<div id="loading">
Carregando...
</div>

<a-scene

mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiScanning: yes;"

embedded

color-space="sRGB"

renderer="colorManagement:true, physicallyCorrectLights"

vr-mode-ui="enabled:false"

device-orientation-permission-ui="enabled:true"

>

<a-assets>

<a-asset-item
id="modelo"
src="Untitled.glb">
</a-asset-item>

</a-assets>

<a-camera
position="0 0 0"
look-controls="enabled:false">
</a-camera>

<a-entity mindar-image-target="targetIndex:0">

<a-gltf-model

src="#modelo"

position="0 0 0"

rotation="0 0 0"

scale="0.3 0.3 0.3"

animation-mixer>

</a-gltf-model>

</a-entity>

<a-light
type="ambient"
intensity="1.2">
</a-light>

<a-light
type="directional"
intensity="1"
position="1 2 1">
</a-light>

</a-scene>

<script>

document.addEventListener("DOMContentLoaded",()=>{

document.querySelector("a-scene")
.addEventListener("loaded",()=>{

document.getElementById("loading").style.display="none";

});

});

</script>

</body>
</html>
