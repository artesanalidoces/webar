<!doctype html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cap Tino AR</title>

<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

<style>

body{
margin:0;
background:#f5f5f5;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

model-viewer{
width:100%;
height:100vh;
background:white;
}

</style>

</head>

<body>

<model-viewer

src="Untitled.glb"

camera-controls

auto-rotate

ar

ar-modes="scene-viewer webxr quick-look"

shadow-intensity="1"

exposure="1"

>

</model-viewer>

</body>
</html>
