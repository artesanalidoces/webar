<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Artesanali 3D</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js">
  </script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,body{
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:Arial,Helvetica,sans-serif;
      background:#f5f5f5;
    }

    header{
      height:60px;
      background:#7B3F00;
      color:#fff;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:24px;
      font-weight:bold;
    }

    model-viewer{
      width:100%;
      height:calc(100vh - 130px);
      background:white;
    }

    footer{
      height:70px;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#ffffff;
      border-top:1px solid #ddd;
    }

    button{
      padding:15px 30px;
      font-size:18px;
      border:none;
      border-radius:8px;
      background:#d32f2f;
      color:white;
      cursor:pointer;
    }

    button:hover{
      background:#b71c1c;
    }
  </style>

</head>

<body>

<header>
Artesanali Doces
</header>

<model-viewer
    id="viewer"
    src="Untitled.glb"
    alt="Modelo 3D"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1"
    environment-image="neutral"
    loading="eager">
</model-viewer>

<footer>

<button id="btnAR">
Ver em Realidade Aumentada
</button>

</footer>

<script>
const viewer = document.getElementById("viewer");
const btn = document.getElementById("btnAR");

btn.addEventListener("click", async () => {
  try {
    await viewer.activateAR();
  } catch (e) {
    alert("Este dispositivo não suporta Realidade Aumentada.");
    console.error(e);
  }
});
</script>

</body>
</html>
