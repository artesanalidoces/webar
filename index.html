<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Artesanali AR</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

body{
margin:0;
background:#faf7f2;
font-family:Arial,Helvetica,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{

width:90%;
max-width:500px;

background:white;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.15);

padding:20px;

text-align:center;

}

h1{

color:#7b3f00;

}

model-viewer{

width:100%;

height:500px;

background:#eeeeee;

border-radius:15px;

}

</style>

</head>

<body>

<div class="card">

<h1>Artesanali</h1>

<p>Visualize nosso modelo em 3D</p>

<model-viewer

src="Untitled.glb"

camera-controls

auto-rotate

shadow-intensity="1"

ar

ar-modes="scene-viewer webxr quick-look"

>

<button slot="ar-button"
style="
background:#e63946;
color:white;
border:none;
padding:15px 25px;
border-radius:10px;
font-size:18px;
cursor:pointer;
">

📷 Ver em Realidade Aumentada

</button>

</model-viewer>

</div>

</body>

</html>
